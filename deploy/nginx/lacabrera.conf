# LA CABRERA - HTTPS Reverse Proxy
# Copia versionada de /etc/nginx/sites-available/lacabrera (VPS de producción).
# Instalación: ver deploy/nginx/README.md
server {
    listen 80;
    server_name cabreraapp.pillow.com.ar;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    # Subida de archivos (ZIP de Toast de Miami ~15 MB). Sin esto nginx corta en 1 MB (error 413)
    client_max_body_size 100M;
    server_name cabreraapp.pillow.com.ar;
    
    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/cabreraapp.pillow.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cabreraapp.pillow.com.ar/privkey.pem;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    
    # Security Headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Frontend
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # API Backend - pass through all headers including CORS
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        
        # Pass CORS headers from backend
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Allow-Credentials;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Health check
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}
