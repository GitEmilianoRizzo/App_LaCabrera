# ============================================
# LA CABRERA - Docker Compose PRODUCCION
# Frontend + Backend (SQL Server externo)
# SSL handled by system nginx reverse proxy
# ============================================

services:
  # ----------------------------------------
  # Frontend (React + Nginx)
  # Exposed on 8080, system nginx proxies 443->8080
  # ----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: lacabrera-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lacabrera-network
    restart: always

  # ----------------------------------------
  # Backend API (.NET 8)
  # ----------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/LaCabrera.Api/Dockerfile
    container_name: lacabrera-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__LaCabreraDb=${DB_CONNECTION_STRING}
      - Serilog__MinimumLevel__Default=Warning
      - Jwt__Secret=${JWT_SECRET}
      # Parser (Toast/TXT): contenedor lacabrera-parser en la misma red; dentro del contenedor localhost no sirve
      - ParserService__BaseUrl=${PARSER_SERVICE_URL:-http://lacabrera-parser:8000}
      # Sincronización diaria de los conectores por API (10:00 hora argentina). Apagada salvo que se habilite en el .env del servidor
      - SyncConectores__Enabled=${SYNC_CONECTORES_ENABLED:-false}
      # Clave de la cuenta de servicio de Google Drive (Colombia). Vive en el servidor, fuera del repo
      - GoogleDrive__CredencialesPath=/app/secrets/gdrive-sa.json
    networks:
      - lacabrera-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    volumes:
      - api-logs:/app/logs
      - ./secrets/gdrive-sa.json:/app/secrets/gdrive-sa.json:ro

  # ----------------------------------------
  # Parser de archivos (Toast HTML + CSV, TXT). Python/FastAPI
  # Solo lo usa la API (http://lacabrera-parser:8000 por la red interna);
  # el puerto queda publicado solo en localhost para diagnóstico.
  # ----------------------------------------
  parser:
    build:
      context: services/parser-service
    image: lacabrera-parser
    container_name: lacabrera-parser
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - lacabrera-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

networks:
  lacabrera-network:
    driver: bridge

volumes:
  api-logs:
    driver: local
